name: FL Studio Controller CI

on:
  push:
    branches:
      - feat/fl-studio-controller
  pull_request:
    branches:
      - main_2025
  workflow_dispatch:

concurrency:
  group: fl-studio-controller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: midi-poly-grid-fl-studio-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
